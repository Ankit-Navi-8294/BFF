server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.bff: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-change-in-production-with-at-least-256-bits}
    expiration: 86400000  # 24 hours
    refresh-expiration: 604800000  # 7 days
