version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bff-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bff_db
      MYSQL_USER: bff_user
      MYSQL_PASSWORD: bff_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bff-backend
    environment:
      DB_USERNAME: bff_user
      DB_PASSWORD: bff_password
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bff_db
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - bff-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bff-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - bff-network

volumes:
  mysql_data:

networks:
  bff-network:
    driver: bridge
